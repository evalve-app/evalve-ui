name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen:api && npm run gen:evalve-api
      - run: git diff --exit-code -- src/api/schema.d.ts src/api/evalve-schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
